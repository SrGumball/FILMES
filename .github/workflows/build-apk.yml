name: Build HomeFlix TV APK & Publish Release

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Rename APK for Release
      run: |
        mkdir -p release-output
        cp app/build/outputs/apk/debug/app-debug.apk release-output/HomeFlix-TV-v1.0.apk

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: HomeFlix-TV-Debug-APK
        path: release-output/HomeFlix-TV-v1.0.apk

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: HomeFlix TV Release v1.0.${{ github.run_number }}
        body: |
          🎬 **HomeFlix TV APK para Android TV**
          
          - Suporte a streaming em 4K/1080p
          - Integração com Google Drive
          - Compatível com controle remoto D-Pad
        files: release-output/HomeFlix-TV-v1.0.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
